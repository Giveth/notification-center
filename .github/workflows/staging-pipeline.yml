name: staging-pipeline

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

# Least-privilege GITHUB_TOKEN: deny everything at the workflow level, then grant
# only what each job actually needs (see per-job `permissions` below).
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Label used to access the service container
      redis:
        # Docker Hub image
        image: redis
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6490:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notification-center
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5446:5432
    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 20.14.0
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn install
      - name: Run linter
        run: yarn lint
      - name: Run migrations
        run: yarn db:migrate:run:test
      - name: Run tests
        run: yarn test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Build image and push to GitHub Packages
        uses: docker/build-push-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io
          repository: giveth/notification-center
          add_git_labels: true
          # Add branch name to docker image tag @see{@link https://github.com/docker/build-push-action/tree/releases/v1#tag_with_ref}
          tag_with_ref: true
          # Add commit hash to docker image tag @see{@link https://github.com/docker/build-push-action/tree/releases/v1#tag_with_sha}
          tag_with_sha: true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # No GITHUB_TOKEN needed: the SSH action authenticates with a deploy key.
    permissions: {}
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST_ALL }}
          username: ${{ secrets.STAGING_USERNAME_ALL }}
          key: ${{ secrets.STAGING_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            # Use docker compose v2 (host has v2.40.0). The old `docker-compose`
            # v1.29.2 crashes with `KeyError: 'ContainerConfig'` when recreating a
            # BuildKit-format image (it choked on the redis-all dep), which left NC
            # stopped-and-not-restarted while the run still went green — the failure
            # was masked by the trailing `prune` (last command, exit 0). `set -e`
            # makes a failed deploy fail RED; `-f docker-compose.staging.yml` pins the
            # staging image tag deterministically; `--no-deps` avoids churning
            # redis-all. Mirrors the prod (main) pipeline, which already uses v2.
            docker compose -f docker-compose.staging.yml pull notification-center
            docker compose -f docker-compose.staging.yml up -d --no-deps notification-center
            # Best-effort cleanup — never fail an already-successful deploy if prune
            # errors (e.g. an image still in use); `set -e` would otherwise turn it red.
            docker image prune -a --force || echo "Image cleanup failed (non-fatal)" >&2
